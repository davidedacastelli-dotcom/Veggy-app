name: Crea APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Scarica la libreria per i codici a barre
        run: curl -fsSL https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js -o app/src/main/assets/www/zxing.min.js

      - name: Compila
        run: gradle assembleDebug --no-daemon

      - name: Rinomina
        run: cp app/build/outputs/apk/debug/app-debug.apk VeggieScan.apk

      - name: Pubblica il download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: VeggieScan ${{ github.run_number }}
          body: Tocca VeggieScan.apk qui sotto per scaricare l'app.
          make_latest: true
          files: VeggieScan.apk
