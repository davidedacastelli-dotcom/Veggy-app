<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VeggieScan</title>
<meta name="theme-color" content="#2F5A1A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one phone screen, stacked — bar, viewfinder, result card, recent scans */
:root{
  --bg:#F2F6EC; --card:#FFFFFF; --ink:#1B2A12; --ink-2:#4E5F42; --line:#DCE6D0;
  --leaf:#2F5A1A; --leaf-2:#4C8A26; --sprout:#9BCB5E; --mint:#E3F0D3;
  --no:#B3412E; --no-bg:#F8E3DD; --maybe:#9A6B10; --maybe-bg:#F7ECD3;
  --prot:#4C8A26; --carb:#C9A227; --fat:#D9774A;
  --scan-bg:#16290C;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1A0A; --card:#18260F; --ink:#E8F1DD; --ink-2:#A9BB98; --line:#2A3D1F;
    --leaf:#8FC25A; --leaf-2:#A7D46F; --sprout:#6FA53A; --mint:#22381A;
    --no:#F08A72; --no-bg:#3A1A13; --maybe:#E7B654; --maybe-bg:#33270E;
    --prot:#8FC25A; --carb:#E2C04F; --fat:#EE9168; --scan-bg:#0A1406;
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
.app{height:100%;max-width:480px;margin:0 auto;display:grid;grid-template-rows:auto minmax(200px,1fr) auto auto;gap:12px;
  padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
header{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;font:700 22px/1 var(--display);letter-spacing:-.02em;color:var(--leaf)}
.brand svg{width:30px;height:30px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--leaf);display:grid;place-items:center;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
button:focus-visible,input:focus-visible{outline:2px solid var(--leaf-2);outline-offset:2px}

.scanner{position:relative;border-radius:24px;overflow:hidden;background:var(--scan-bg);min-height:0}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#CFE6B4;text-align:center;padding:12px}
.idle svg{width:min(62%,220px);height:auto}
.frame{position:absolute;left:14%;right:14%;top:26%;bottom:26%;pointer-events:none}
.frame i{position:absolute;width:26px;height:26px;border:3px solid #B2E078}
.frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 10px}
.frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
.laser{position:absolute;left:4%;right:4%;height:2px;background:#B2E078;top:50%;animation:sweep 1.8s ease-in-out infinite alternate}
@keyframes sweep{from{top:12%}to{top:88%}}
@media (prefers-reduced-motion:reduce){.laser{animation:none}}
.scan-cta{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px}
.pill{border:0;border-radius:999px;padding:11px 18px;font:600 15px/1 var(--body);display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.pill svg{width:18px;height:18px}
.pill.go{background:#B2E078;color:#16290C}
.pill.ghost{background:rgba(255,255,255,.14);color:#E8F5D8}
.manual{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;background:var(--card);border-radius:16px;padding:6px}
.manual input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 16px var(--body);padding:8px 10px;font-variant-numeric:tabular-nums}
.manual .pill{padding:9px 14px}
.manual .go{background:var(--leaf);color:#fff}

.result{background:var(--card);border-radius:24px;border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:12px;max-height:62vh;overflow:auto}
.msg{min-height:240px}
.prod{display:flex;gap:12px;align-items:center}
.thumb{width:68px;height:68px;border-radius:16px;background:var(--mint);flex:none;overflow:hidden;display:grid;place-items:center}
.thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.thumb svg{width:46px;height:46px}
.prod-txt{min-width:0}
.prod h1{margin:0;font:700 19px/1.15 var(--display);letter-spacing:-.01em;text-wrap:balance;overflow-wrap:anywhere}
.prod p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.tag{display:inline-block;margin-top:4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:var(--mint);border-radius:6px;padding:2px 6px}

.verdict{display:flex;align-items:center;gap:10px;border-radius:16px;padding:10px 12px}
.verdict svg{width:28px;height:28px;flex:none}
.verdict b{display:block;font:700 18px/1.1 var(--display)}
.verdict span{font-size:13px}
.v-yes{background:var(--leaf);color:#fff}
.v-yes span{color:#DCEFC6}
@media (prefers-color-scheme: dark){.v-yes{color:#10200A}.v-yes span{color:#22401A}}
.v-no{background:var(--no-bg);color:var(--no)}
.v-maybe,.v-unknown{background:var(--maybe-bg);color:var(--maybe)}

.nutri{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.ring{position:relative;width:104px;height:104px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font:700 24px/1 var(--display);font-variant-numeric:tabular-nums}
.ring .c small{font-size:11px;color:var(--ink-2)}
.macros{display:flex;flex-direction:column;gap:8px}
.m-row{display:grid;grid-template-columns:86px 1fr 48px;align-items:center;gap:8px;font-size:13px}
.m-row .lbl{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%}
.bar{height:8px;background:var(--mint);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;transition:width .5s ease}
.m-row .val{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;background:var(--mint);color:var(--ink-2);border-radius:999px;padding:4px 10px;font-variant-numeric:tabular-nums}
.chip b{color:var(--ink);font-weight:600}
.note{font-size:12.5px;color:var(--ink-2);margin:0}
.note b{color:var(--no)}
.msg{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;height:100%;color:var(--ink-2)}
.msg svg{width:90px;height:90px}
.msg h2{margin:0;font:700 18px var(--display);color:var(--ink)}

.recent h3{margin:0 0 6px;font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.r-item{flex:none;width:58px;cursor:pointer;background:none;border:0;padding:0;color:inherit;text-align:center}
.r-img{position:relative;width:58px;height:58px;border-radius:14px;background:var(--card);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.r-img img{width:100%;height:100%;object-fit:contain;background:#fff}
.r-img svg{width:30px;height:30px}
.r-img em{position:absolute;right:3px;bottom:3px;width:12px;height:12px;border-radius:50%;border:2px solid var(--card)}
.r-item small{display:block;font-size:10.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.empty-r{font-size:12.5px;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:5}
.spin{width:34px;height:34px;border:3px solid var(--mint);border-top-color:var(--leaf);border-radius:50%;animation:rot 0.8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="#2F5A1A"/><path d="M9 22c0-8 6-13 15-13-1 9-6 15-14 14" fill="#B2E078"/><path d="M9.5 22.5 19 13" stroke="#2F5A1A" stroke-width="1.6" stroke-linecap="round"/></svg>
      VeggieScan
    </div>
    <button class="iconbtn" id="kbBtn" aria-label="Inserisci il codice a mano">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
    </button>
  </header>

  <section class="scanner" id="scanner">
    <video id="video" playsinline muted hidden></video>
    <div class="idle" id="idle">
      <svg viewBox="0 0 240 130" aria-hidden="true">
        <ellipse cx="120" cy="118" rx="100" ry="8" fill="#2A4A18"/>
        <path d="M40 112c-6-30 10-52 32-56 6 24-6 48-32 56z" fill="#6FA53A"/><path d="M41 111 66 64" stroke="#2A4A18" stroke-width="2"/>
        <g transform="rotate(18 92 70)"><path d="M84 46h16l-8 66z" fill="#E98A3A"/><path d="M86 56h6M88 70h6M89 84h4" stroke="#C46A22" stroke-width="2" stroke-linecap="round"/><path d="M92 46c-6-10-2-16 0-18 2 2 6 8 0 18zM92 46c4-8 10-10 13-9-1 4-6 9-13 9z" fill="#8FC25A"/></g>
        <ellipse cx="146" cy="84" rx="26" ry="32" fill="#4C8A26"/><ellipse cx="146" cy="88" rx="19" ry="25" fill="#D9EBA6"/><circle cx="146" cy="96" r="11" fill="#8A5A2B"/>
        <circle cx="194" cy="74" r="13" fill="#5C9A2E"/><circle cx="206" cy="84" r="12" fill="#6FA53A"/><circle cx="184" cy="88" r="12" fill="#4C8A26"/><path d="M194 92v20" stroke="#9BCB5E" stroke-width="7" stroke-linecap="round"/>
        <rect x="104" y="6" width="32" height="22" rx="4" fill="none" stroke="#B2E078" stroke-width="2"/><path d="M110 11v12M114 11v12M117 11v12M121 11v12M126 11v12M130 11v12" stroke="#B2E078" stroke-width="1.6"/>
      </svg>
      <span>Inquadra il codice a barre di un prodotto</span>
    </div>
    <div class="frame" id="frame" hidden><i></i><i></i><i></i><i></i><div class="laser"></div></div>
    <div class="scan-cta" id="cta">
      <button class="pill go" id="scanBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M8 9v6M11 9v6M14 9v6M17 9v6"/></svg>
        <span id="scanLbl">Scansiona</span>
      </button>
    </div>
    <form class="manual" id="manual" hidden>
      <input id="codeIn" inputmode="numeric" pattern="[0-9]{6,14}" placeholder="8001234567890" aria-label="Codice a barre" autocomplete="off">
      <button class="pill go" type="submit">Cerca</button>
      <button class="pill" type="button" id="closeManual" aria-label="Chiudi" style="background:var(--mint);color:var(--ink)">✕</button>
    </form>
  </section>

  <section class="result" id="result" aria-live="polite"></section>

  <section class="recent">
    <h3>Scansioni recenti</h3>
    <div class="strip" id="strip"></div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const FIELDS = "product_name,product_name_it,brands,quantity,image_front_small_url,image_front_url,ingredients_analysis_tags,labels_tags,ingredients,nutriments";
const COLORS = { yes: "var(--leaf-2)", no: "var(--no)", maybe: "var(--maybe)", unknown: "var(--maybe)" };

const CARTON = `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M14 14l4-8h12l4 8v28H14z" fill="#fff" stroke="#4C8A26" stroke-width="2" stroke-linejoin="round"/><path d="M14 14h20" stroke="#4C8A26" stroke-width="2"/><path d="M19 30c0-6 4-9 9-9 0 6-4 9-9 9z" fill="#9BCB5E"/><path d="M19 30l6-6" stroke="#4C8A26" stroke-width="1.4"/></svg>`;

const EXAMPLE = {
  code: "esempio", example: true, name: "Bevanda all'avena", brand: "Prodotto di esempio", qty: "1 L", img: "",
  vegan: "yes", culprits: [], maybe: [],
  kcal: 46, p: 1, c: 6.7, f: 1.5, sugar: 4, fiber: 0.8, salt: 0.1
};

let recent = [];
try { recent = JSON.parse(localStorage.getItem("vs-recent") || "[]"); } catch (e) {}
function saveRecent() { try { localStorage.setItem("vs-recent", JSON.stringify(recent.slice(0, 12))); } catch (e) {} }

function num(v) { const n = parseFloat(v); return isFinite(n) ? n : null; }
function fmt(v, d = 1) { return v == null ? "–" : (Math.round(v * 10 ** d) / 10 ** d).toLocaleString("it-IT"); }
function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

const VERDICT = {
  yes: ["Vegano", "Nessun ingrediente di origine animale", `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m8 12.5 2.8 2.8L16.5 9.5"/></svg>`],
  no: ["Non vegano", "Contiene ingredienti di origine animale", `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="m9 9 6 6M15 9l-6 6"/></svg>`],
  maybe: ["Forse vegano", "Alcuni ingredienti potrebbero essere animali", `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16.5h.01"/></svg>`],
  unknown: ["Non determinato", "Ingredienti non disponibili nel database", `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.4M12 17h.01"/></svg>`]
};

function ring(p) {
  const kP = (p.p || 0) * 4, kC = (p.c || 0) * 4, kF = (p.f || 0) * 9, tot = kP + kC + kF;
  const R = 42, C = 2 * Math.PI * R;
  let off = 0, arcs = "";
  if (tot > 0) {
    for (const [k, col] of [[kP, "var(--prot)"], [kC, "var(--carb)"], [kF, "var(--fat)"]]) {
      const len = (k / tot) * C;
      if (len > 0.5) arcs += `<circle cx="52" cy="52" r="${R}" fill="none" stroke="${col}" stroke-width="12" stroke-dasharray="${Math.max(len - 2, 0.1)} ${C}" stroke-dashoffset="${-off}" stroke-linecap="butt"/>`;
      off += len;
    }
  }
  return `<div class="ring"><svg viewBox="0 0 104 104"><circle cx="52" cy="52" r="${R}" fill="none" stroke="var(--mint)" stroke-width="12"/>${arcs}</svg>
    <div class="c"><b>${p.kcal == null ? "–" : Math.round(p.kcal)}</b><small>kcal / 100 g</small></div></div>`;
}

function macroRow(label, val, color, max) {
  const w = val == null ? 0 : Math.min(100, (val / max) * 100);
  return `<div class="m-row"><span class="lbl"><span class="dot" style="background:${color}"></span>${label}</span>
    <div class="bar"><i style="width:${w}%;background:${color}"></i></div><span class="val">${fmt(val)} g</span></div>`;
}

function render(p) {
  const v = VERDICT[p.vegan] || VERDICT.unknown;
  const img = p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy">` : CARTON;
  let note = "";
  if (p.culprits.length) note = `<p class="note">Ingredienti animali: <b>${esc(p.culprits.slice(0, 5).join(", "))}</b></p>`;
  else if (p.maybe.length) note = `<p class="note">Da verificare: ${esc(p.maybe.slice(0, 5).join(", "))}</p>`;
  $("result").innerHTML = `
    <div class="prod"><div class="thumb">${img}</div>
      <div class="prod-txt"><h1>${esc(p.name)}</h1><p>${esc([p.brand, p.qty].filter(Boolean).join(" · "))}</p>
      ${p.example ? '<span class="tag">Esempio</span>' : ""}</div></div>
    <div class="verdict v-${p.vegan}">${v[2]}<div><b>${v[0]}</b><span>${v[1]}</span></div></div>
    <div class="nutri">${ring(p)}
      <div class="macros">${(() => { const mx = Math.max(10, p.p || 0, p.c || 0, p.f || 0); return macroRow("Proteine", p.p, "var(--prot)", mx) + macroRow("Carboidrati", p.c, "var(--carb)", mx) + macroRow("Grassi", p.f, "var(--fat)", mx); })()}</div></div>
    <div class="chips"><span class="chip">Zuccheri <b>${fmt(p.sugar)} g</b></span><span class="chip">Fibre <b>${fmt(p.fiber)} g</b></span><span class="chip">Sale <b>${fmt(p.salt, 2)} g</b></span></div>
    ${note}`;
}

function renderMsg(title, text, loading) {
  $("result").innerHTML = `<div class="msg">${loading ? '<div class="spin"></div>' : CARTON.replace('viewBox', 'width="90" height="90" viewBox')}<h2>${esc(title)}</h2><p style="margin:0">${esc(text)}</p></div>`;
}

function renderRecent() {
  const s = $("strip");
  if (!recent.length) { s.innerHTML = `<span class="empty-r">I prodotti che scansioni appariranno qui.</span>`; return; }
  s.innerHTML = recent.map((p, i) => `<button class="r-item" data-i="${i}" aria-label="${esc(p.name)}">
      <div class="r-img">${p.img ? `<img src="${esc(p.img)}" alt="" loading="lazy">` : CARTON}<em style="background:${COLORS[p.vegan] || COLORS.unknown}"></em></div>
      <small>${esc(p.name)}</small></button>`).join("");
}
$("strip").addEventListener("click", (e) => {
  const b = e.target.closest(".r-item"); if (b) render(recent[+b.dataset.i]);
});

function toast(t) {
  const el = document.createElement("div"); el.className = "toast"; el.textContent = t;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2600);
}

function parseProduct(code, d) {
  const tags = d.ingredients_analysis_tags || [], labels = d.labels_tags || [];
  let vegan = "unknown";
  if (tags.includes("en:non-vegan")) vegan = "no";
  else if (tags.includes("en:vegan")) vegan = "yes";
  else if (tags.includes("en:maybe-vegan")) vegan = "maybe";
  if (labels.includes("en:vegan") && vegan !== "no") vegan = "yes";
  const culprits = [], maybe = [];
  (function walk(list) {
    for (const ing of list || []) {
      const name = (ing.text || "").replace(/_/g, "").trim();
      if (ing.vegan === "no" && name) culprits.push(name);
      else if (ing.vegan === "maybe" && name) maybe.push(name);
      if (ing.ingredients) walk(ing.ingredients);
    }
  })(d.ingredients);
  const n = d.nutriments || {};
  let kcal = num(n["energy-kcal_100g"]);
  if (kcal == null && num(n["energy_100g"]) != null) kcal = num(n["energy_100g"]) / 4.184;
  return {
    code, name: d.product_name_it || d.product_name || "Prodotto senza nome", brand: (d.brands || "").split(",")[0].trim(),
    qty: d.quantity || "", img: d.image_front_small_url || d.image_front_url || "",
    vegan, culprits: [...new Set(culprits)], maybe: [...new Set(maybe)],
    kcal, p: num(n.proteins_100g), c: num(n.carbohydrates_100g), f: num(n.fat_100g),
    sugar: num(n.sugars_100g), fiber: num(n.fiber_100g), salt: num(n.salt_100g)
  };
}

async function lookup(code) {
  renderMsg("Cerco il prodotto…", `Codice ${code}`, true);
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${FIELDS}&lc=it`);
    const j = await r.json();
    if (j.status !== 1 || !j.product) { renderMsg("Prodotto non trovato", `Il codice ${code} non è nel database Open Food Facts.`); return; }
    const p = parseProduct(code, j.product);
    render(p);
    recent = [p, ...recent.filter((x) => x.code !== code)].slice(0, 12);
    saveRecent(); renderRecent();
  } catch (e) {
    renderMsg("Nessuna connessione", "Controlla la rete e riprova.");
  }
}

/* ---------- Camera + barcode ---------- */
let stream = null, running = false, zxReader = null;
const video = $("video");

function setScanning(on) {
  running = on;
  video.hidden = !on; $("frame").hidden = !on; $("idle").hidden = on;
  $("scanLbl").textContent = on ? "Ferma" : "Scansiona";
}

function stopScan() {
  running = false;
  if (zxReader) { try { zxReader.reset(); } catch (e) {} zxReader = null; }
  if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
  video.srcObject = null; setScanning(false);
}

function onCode(code) {
  if (!running) return;
  if (navigator.vibrate) navigator.vibrate(60);
  stopScan(); lookup(code);
}

function loadZXing() {
  return new Promise((ok, ko) => {
    if (window.ZXing) return ok();
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
    s.onload = ok; s.onerror = ko; document.head.appendChild(s);
  });
}

async function startScan() {
  if (!navigator.mediaDevices?.getUserMedia) { toast("La fotocamera non è disponibile: inserisci il codice a mano"); openManual(); return; }
  const constraints = { video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
  try {
    if ("BarcodeDetector" in window) {
      const formats = await BarcodeDetector.getSupportedFormats();
      const want = ["ean_13", "ean_8", "upc_a", "upc_e"].filter((f) => formats.includes(f));
      if (want.length) {
        const det = new BarcodeDetector({ formats: want });
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream; await video.play(); setScanning(true);
        const tick = async () => {
          if (!running) return;
          try { const codes = await det.detect(video); if (codes.length) return onCode(codes[0].rawValue); } catch (e) {}
          setTimeout(tick, 180);
        };
        tick(); return;
      }
    }
    await loadZXing();
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8, ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E]);
    zxReader = new ZXing.BrowserMultiFormatReader(hints);
    setScanning(true);
    await zxReader.decodeFromConstraints(constraints, video, (res) => { if (res) onCode(res.getText()); });
  } catch (e) {
    stopScan();
    toast(e && e.name === "NotAllowedError" ? "Permesso fotocamera negato" : "Impossibile avviare la fotocamera");
  }
}

$("scanBtn").addEventListener("click", () => (running ? stopScan() : startScan()));

function openManual() { stopScan(); $("manual").hidden = false; $("cta").hidden = true; $("codeIn").focus(); }
function closeManual() { $("manual").hidden = true; $("cta").hidden = false; }
$("kbBtn").addEventListener("click", openManual);
$("closeManual").addEventListener("click", closeManual);
$("manual").addEventListener("submit", (e) => {
  e.preventDefault();
  const c = $("codeIn").value.replace(/\D/g, "");
  if (c.length < 6) { toast("Inserisci un codice di almeno 6 cifre"); return; }
  closeManual(); $("codeIn").value = ""; lookup(c);
});

document.addEventListener("visibilitychange", () => { if (document.hidden && running) stopScan(); });

render(recent[0] || EXAMPLE);
renderRecent();

if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
